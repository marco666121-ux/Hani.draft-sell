<!DOCTYPE html>
<html lang="en" data-build="v10">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title>
<style>
:root{--bg:#fff;--fg:#0b0b0b;--muted:#6b6b6b;--card:#f6f6f7;--border:#e3e3e6;--btn:#0b0b0b;--btnfg:#fff;--danger:#d33;--ok:#1a8f4c}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f4f4f5;--muted:#9a9aa0;--card:#161618;--border:#2a2a2e;--btn:#f4f4f5;--btnfg:#0a0a0a;--danger:#ff6b6b;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main.wrap{flex:1 0 auto;width:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:19px;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:10px;background:var(--btn);color:var(--btnfg);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.hero{padding:28px 0 12px}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.8px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 0 40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.card .img{aspect-ratio:1/1;background:linear-gradient(135deg,#222,#555);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:800;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:10px 12px 12px}
.card .t{font-weight:700;font-size:15px;margin:0 0 2px}
.card .p{font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted);border:1px dashed var(--border);border-radius:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.btn.wide{width:100%;padding:14px;font-size:15px;border-radius:14px}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn svg,.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{flex:none;border-top:1px solid var(--border);padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--fg);font-weight:600;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet{align-items:center}}
.sheet-body{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--border)}
@media(min-width:700px){.sheet-body{border-radius:22px}}
.sheet-body.big{max-width:760px;height:92vh;height:92dvh}
.qr{background:#fff;border-radius:16px;padding:12px;width:208px;margin:0 auto;border:1px solid var(--border)}
.qr svg{display:block;width:100%;height:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:12px}
label.f{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--border);padding:5px;border-radius:14px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnfg)}
.gallery .main{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--fg)}
.price{font-size:26px;font-weight:800;letter-spacing:-.5px}
.pre{white-space:pre-wrap}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.pubbar{position:sticky;top:-18px;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--border);margin-bottom:12px}
.note{font-size:13px;color:var(--muted)}
.plist .item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.plist .item img,.plist .item .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#333;flex:none}
.plist .item .grow{flex:1;min-width:0}
.plist .item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative}
.imgs img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.imgs .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-weight:700;line-height:1;cursor:pointer}
h2{margin:0;font-size:20px;letter-spacing:-.3px}
h3{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btnfg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:100;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
</style>
</head>
<body>

  <div class="brand"><span class="logo" id="logo"></span><b id="brandName"></b></div>

<footer>

</footer>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" hidden></div>

        for (t = 0; t <= 5; t++) setF(8, t, bit(b, t)); setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
        for (t = 9; t < 15; t++) setF(14 - t, 8, bit(b, t));
        for (t = 0; t < 8; t++) setF(size - 1 - t, 8, bit(b, t));
        for (t = 8; t < 15; t++) setF(8, size - 15 + t, bit(b, t));
        setF(8, size - 8, true);
      }
      format(0);
      if (ver >= 7) {
        var rr = ver; for (i = 0; i < 12; i++) rr = (rr << 1) ^ ((rr >>> 11) * 0x1F25);
        var vb = (ver << 12) | rr; for (i = 0; i < 18; i++) { var a = size - 11 + i % 3, b2 = Math.floor(i / 3); setF(a, b2, bit(vb, i)); setF(b2, a, bit(vb, i)); }
      }
      var idx = 0;
      for (var right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (var vert = 0; vert < size; vert++) for (var j = 0; j < 2; j++) {
          var x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && idx < all.length * 8) { m[y][x] = bit(all[idx >>> 3], 7 - (idx & 7)); idx++; }
        }
      }
      function maskFn(k, x, y) {
        switch (k) { case 0: return (x + y) % 2 === 0; case 1: return y % 2 === 0; case 2: return x % 3 === 0; case 3: return (x + y) % 3 === 0;
          case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; case 5: return x * y % 2 + x * y % 3 === 0;
          case 6: return (x * y % 2 + x * y % 3) % 2 === 0; default: return ((x + y) % 2 + x * y % 3) % 2 === 0; }
      }
      function applyMask(k) { for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) if (!fn[y][x] && maskFn(k, x, y)) m[y][x] = !m[y][x]; }
      function penalty() {
        var p = 0, y, x, run, dark = 0;
        for (y = 0; y < size; y++) { run = 1; for (x = 1; x < size; x++) { if (m[y][x] === m[y][x - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
        for (x = 0; x < size; x++) { run = 1; for (y = 1; y < size; y++) { if (m[y][x] === m[y - 1][x]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
        for (y = 0; y < size - 1; y++) for (x = 0; x < size - 1; x++) if (m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
        for (y = 0; y < size; y++) for (x = 0; x < size; x++) if (m[y][x]) dark++;
        p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
        return p;
      }
      var best = 0, bp = Infinity;
      for (var k = 0; k < 8; k++) { applyMask(k); format(k); var pe = penalty(); if (pe < bp) { bp = pe; best = k; } applyMask(k); }
      applyMask(best); format(best);
      return m;
    }
    return { svg: function (text) {
      var m = encode(text); if (!m) return '';
      var n = m.length, q = 4, d = '';
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (m[y][x]) d += 'M' + (x + q) + ',' + (y + q) + 'h1v1h-1z';
      return '<svg viewBox="0 0 ' + (n + 2 * q) + ' ' + (n + 2 * q) + '" shape-rendering="crispEdges" role="img" aria-label="UPI payment QR code"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    } };
  })();

  function drawPayment() {
    openSheet(
      '<form data-form="pay" class="stack"><div class="row"><h2>Payment</h2><span class="note">Step 2 of 2</span></div>' +
      '<div class="box"><div class="kv"><span class="muted">Order</span><b>' + esc(order.id) + '</b></div>' +
      '<div class="kv"><span class="muted">Product</span><b>' + esc(cur.title) + '</b></div>' +
      '<div class="kv"><span class="muted">Amount</span><b>' + money(cur.price) + '</b></div>' +
      '<div class="kv"><span class="muted">Pay to</span><b>' + esc(S.merchantName) + '</b></div>' +
      '<div class="kv"><span class="muted">UPI ID</span><b>' + esc(S.merchantUpiId) + '</b></div></div>' +
      (function () { var q = QR.svg(upiLink()); return q ? '<div class="qr">' + q + '</div><p class="note" style="margin:0;text-align:center">Scan with any UPI app to pay ' + money(cur.price) + '</p>' : ''; })() +
      '<div style="display:flex;gap:8px"><button class="btn" style="flex:1" type="button" data-act="copy-upi">' + icon('copy') + 'Copy UPI ID</button><a class="btn primary" style="flex:1" href="' + esc(upiLink()) + '">Open UPI app</a></div>' +
      '<p class="note" style="margin:0">After paying, send your details on WhatsApp. Add the 12-digit UTR if you have it.</p>' +
      '<div><label class="f">UTR / Transaction ID (optional)</label><input type="text" id="o-utr" inputmode="numeric" maxlength="12" placeholder="12-digit UTR" value="' + esc(order.utr) + '"></div>' +
      '<button class="btn primary wide" type="submit">' + icon('send') + 'Send details to WhatsApp</button>' +
      '<button class="btn wide" type="button" data-act="back-details">Back</button></form>');
  }
  actions['back-details'] = function () { drawDetails(); };
  actions['copy-upi'] = function () {
    var v = S.merchantUpiId || '';
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function () { toast('UPI ID copied'); }, function () { toast(v); });
    else toast(v);
  };
  submits.pay = function () {
    order.utr = ($('o-utr') || {}).value || '';
    var lines = ['New order', 'Order ID: ' + order.id, 'Product: ' + cur.title, 'Price: ' + money(cur.price), 'Name: ' + order.name,
      'Contact: ' + (order.method === 'phone' ? order.code + ' ' + order.value : order.value)];
    if (order.utr.trim()) lines.push('UTR: ' + order.utr.trim());
    var num = String(S.whatsappNumber || '').replace(/\D/g, '');
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
  };

  /* ---------- admin ---------- */
  function openPin() {
    openSheet('<form data-form="pin" class="stack"><h2>Admin access</h2><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="Enter PIN">' +
      '<button class="btn primary wide" type="submit">Unlock</button><button class="btn wide" type="button" data-act="close">Cancel</button></form>');
    setTimeout(function () { var p = $('pin'); if (p) p.focus(); }, 50);
  }
  /* Hidden entry: tap the logo (or the footer text) 5 times quickly, or open the link with #admin */
  var taps = 0, tapTimer;
  function secretTap() {
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(function () { taps = 0; }, 2500);
    if (taps >= 5) { taps = 0; openPin(); }
  }
  $('logo').addEventListener('click', secretTap);
  $('footText').addEventListener('click', secretTap);
  submits.pin = function () {
    if (($('pin').value || '').trim() === String(S.adminPin || '2689')) { drawAdmin(); }
    else { toast('Incorrect PIN'); $('pin').value = ''; }
  };

  var formImgs = [], editingId = null;
  function drawAdmin() {
    var list = S.products.map(function (p) {
      var th = (p.images && p.images[0]) ? '<img alt="" src="' + esc(p.images[0]) + '">' : '<span class="ph"></span>';
      return '<div class="item">' + th + '<div class="grow"><b>' + esc(p.title) + '</b><span class="note">' + money(p.price) + '</span></div>' +
        '<button class="btn sm" type="button" data-act="edit" data-id="' + esc(p.id) + '">Edit</button>' +
        '<button class="btn sm danger" type="button" data-act="del" data-id="' + esc(p.id) + '">Delete</button></div>';
    }).join('') || '<p class="note">No products yet.</p>';
    openSheet(
      '<div class="pubbar stack"><div class="row"><h2>Admin panel</h2><button class="btn sm" type="button" data-act="close">Close</button></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" type="button" data-act="dl">' + icon('download') + 'Download HTML</button><button class="btn sm" type="button" data-act="cp">' + icon('copy') + 'Copy HTML</button>' + (hasDraft ? '<button class="btn sm danger" type="button" data-act="discard">Discard changes</button>' : '') + '</div>' +
      '<p class="note" style="margin:0">' + (hasDraft ? 'You have changes saved only in this browser. Download the HTML and upload it to GitHub as index.html to publish.' : 'No unpublished changes.') + '</p></div>' +
      '<form data-form="settings" class="stack"><h3>Store settings</h3>' +
      '<div><label class="f">Brand name</label><input type="text" id="s-brand" value="' + esc(S.brandName) + '"></div>' +
      '<div><label class="f">Logo (link or upload)</label><input type="url" id="s-logo" placeholder="https://..." value="' + esc(String(S.brandLogo || '').indexOf('data:') === 0 ? '' : S.brandLogo) + '"><div style="margin-top:6px"><input type="file" id="s-logofile" accept="image/*"></div>' + (String(S.brandLogo || '').indexOf('data:') === 0 ? '<p class="note">An uploaded logo is in use. Pick a new file or paste a link to replace it.</p>' : '') + '</div>' +
      '<div><label class="f">Theme</label><select id="s-theme"><option value="light"' + (S.theme !== 'dark' ? ' selected' : '') + '>Light</option><option value="dark"' + (S.theme === 'dark' ? ' selected' : '') + '>Dark</option></select></div>' +
      '<div><label class="f">UPI ID</label><input type="text" id="s-upi" value="' + esc(S.merchantUpiId) + '"></div>' +
      '<div><label class="f">Merchant name</label><input type="text" id="s-mname" value="' + esc(S.merchantName) + '"></div>' +
      '<div><label class="f">WhatsApp number (with country code)</label><input type="tel" id="s-wa" value="' + esc(S.whatsappNumber) + '"></div>' +
      '<div><label class="f">Admin PIN</label><input type="text" id="s-pin" inputmode="numeric" value="' + esc(S.adminPin || '2689') + '"></div>' +
      '<button class="btn primary wide" type="submit">Save settings</button></form>' +
      '<h3>Products</h3><div class="plist stack">' + list + '</div>' +
      '<form data-form="product" class="stack" id="pform"><h3>' + (editingId ? 'Edit product' : 'Add product') + '</h3>' +
      '<div><label class="f">Title *</label><input type="text" id="p-title" required></div>' +
      '<div><label class="f">Price (\u20B9) *</label><input type="number" id="p-price" required min="0" step="any" inputmode="decimal"></div>' +
      '<div><label class="f">Description</label><textarea id="p-desc"></textarea></div>' +
      '<div><label class="f">Images</label><div class="imgs" id="p-imgs"></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px"><input type="url" id="p-url" placeholder="Paste image link"><button class="btn" type="button" data-act="addurl">' + icon('plus') + 'Add</button></div>' +
      '<div style="margin-top:8px"><input type="file" id="p-file" accept="image/*" multiple></div></div>' +
      '<button class="btn primary wide" type="submit">' + (editingId ? 'Save product' : 'Add product') + '</button>' +
      (editingId ? '<button class="btn wide" type="button" data-act="cancel-edit">Cancel edit</button>' : '') + '</form>', true);
    fillProductForm();
    var pf = $('p-file'); if (pf) pf.addEventListener('change', onProductFiles);
    var lf = $('s-logofile'); if (lf) lf.addEventListener('change', onLogoFile);
  }
  function fillProductForm() {
    var p = editingId ? S.products.filter(function (x) { return x.id === editingId; })[0] : null;
    if (p && !fillProductForm.done) { $('p-title').value = p.title || ''; $('p-price').value = p.price; $('p-desc').value = p.description || ''; formImgs = (p.images || []).slice(); }
    drawFormImgs();
  }
  function drawFormImgs() {
    var box = $('p-imgs'); if (!box) return;
    box.innerHTML = formImgs.map(function (u, i) { return '<div class="im"><img alt="" src="' + esc(u) + '"><button type="button" class="x" data-act="rmimg" data-i="' + i + '" aria-label="Remove">\u00D7</button></div>'; }).join('') || '<span class="note">No images yet.</span>';
  }
  function toDataUrl(file, max, type) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL(type, 0.82));
        };
        img.onerror = rej; img.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }
  function onProductFiles(e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    Promise.all(files.map(function (f) { return toDataUrl(f, 900, 'image/jpeg'); })).then(function (urls) {
      formImgs = formImgs.concat(urls); drawFormImgs(); toast(urls.length + ' image(s) added');
    }, function () { toast('Could not read that image'); });
  }
  function onLogoFile(e) {
    var f = (e.target.files || [])[0]; if (!f) return;
    toDataUrl(f, 256, 'image/png').then(function (u) { S.brandLogo = u; saveDraft(); renderStore(); toast('Logo updated'); drawAdmin(); }, function () { toast('Could not read that image'); });
  }
  function keepFormValues() { return { t: ($('p-title') || {}).value, p: ($('p-price') || {}).value, d: ($('p-desc') || {}).value }; }
  function restoreFormValues(v) { if (!v) return; $('p-title').value = v.t || ''; $('p-price').value = v.p || ''; $('p-desc').value = v.d || ''; }
  actions.addurl = function () {
    var u = ($('p-url').value || '').trim(); if (!u) return;
    formImgs.push(u); $('p-url').value = ''; drawFormImgs();
  };
  actions.rmimg = function (t) { formImgs.splice(Number(t.getAttribute('data-i')), 1); drawFormImgs(); };
  actions.edit = function (t) {
    editingId = t.getAttribute('data-id'); fillProductForm.done = false;
    drawAdmin(); var f = $('pform'); if (f && f.scrollIntoView) f.scrollIntoView();
  };
  actions['cancel-edit'] = function () { editingId = null; formImgs = []; drawAdmin(); };
  actions.del = function (t) {
    var id = t.getAttribute('data-id');
    if (!window.confirm('Delete this product?')) return;
    S.products = S.products.filter(function (p) { return p.id !== id; });
    if (editingId === id) { editingId = null; formImgs = []; }
    saveDraft(); renderStore(); drawAdmin(); toast('Product deleted');
  };
  submits.product = function () {
    var title = $('p-title').value.trim(), price = Number($('p-price').value);
    if (!title || !(price >= 0)) { toast('Enter title and price'); return; }
    var rec = { id: editingId || uid(), title: title, price: price, description: $('p-desc').value, images: formImgs.slice() };
    var idx = S.products.findIndex(function (p) { return p.id === rec.id; });
    if (idx >= 0) S.products[idx] = rec; else S.products.push(rec);
    editingId = null; formImgs = [];
    saveDraft(); renderStore(); drawAdmin(); toast('Product saved');
  };
  submits.settings = function () {
    S.brandName = $('s-brand').value.trim() || 'My Store';
    var lu = $('s-logo').value.trim(); if (lu) S.brandLogo = lu;
    S.theme = $('s-theme').value === 'dark' ? 'dark' : 'light';
    S.merchantUpiId = $('s-upi').value.trim();
    S.merchantName = $('s-mname').value.trim();
    S.whatsappNumber = $('s-wa').value.replace(/[^\d]/g, '');
    S.adminPin = $('s-pin').value.trim() || '2689';
    saveDraft(); renderStore(); drawAdmin(); toast('Settings saved');
  };
  actions.discard = function () {
    if (!window.confirm('Discard all unpublished changes in this browser?')) return;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    location.reload();
  };

  /* ---------- publish: build updated HTML ---------- */
  function buildHtml() {
    return fetch(location.href.split('#')[0], { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('could not read page, HTTP ' + r.status);
      return r.text();
    }).then(function (html) {
      var re = new RegExp('(<scr' + 'ipt id="store-data"[^>]*>)[\\s\\S]*?(<\\/scr' + 'ipt>)');
      if (!re.test(html)) throw new Error('data block not found');
      var json = JSON.stringify({ stamp: Date.now(), state: S }).replace(/</g, '\\u003c');
      return html.replace(re, function (m, a, b) { return a + json + b; });
    });
  }
  actions.dl = function () {
    buildHtml().then(function (html) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
      toast('Downloaded index.html. Upload it to GitHub to publish.');
    }, function (e) { toast('Open your live https site to export (' + (e.message || e) + ')'); });
  };
  actions.cp = function () {
    buildHtml().then(function (html) { return navigator.clipboard.writeText(html); }).then(
      function () { toast('HTML copied. Paste it into index.html on GitHub.'); },
      function (e) { toast('Could not copy. Try Download HTML.'); });
  };

  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  renderStore();
  function checkHash() { if (location.hash === '#admin') { openPin(); } }
  window.addEventListener('hashchange', checkHash); checkHash();
})();
</script>
</body>
</html>
