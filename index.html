<!DOCTYPE html>
<html lang="en" data-build="v10">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title>
<style>
:root{--bg:#fff;--fg:#0b0b0b;--muted:#6b6b6b;--card:#f6f6f7;--border:#e3e3e6;--btn:#0b0b0b;--btnfg:#fff;--danger:#d33;--ok:#1a8f4c}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f4f4f5;--muted:#9a9aa0;--card:#161618;--border:#2a2a2e;--btn:#f4f4f5;--btnfg:#0a0a0a;--danger:#ff6b6b;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main.wrap{flex:1 0 auto;width:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:19px;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:10px;background:var(--btn);color:var(--btnfg);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.hero{padding:28px 0 12px}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.8px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 0 40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.card .img{aspect-ratio:1/1;background:linear-gradient(135deg,#222,#555);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:800;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:10px 12px 12px}
.card .t{font-weight:700;font-size:15px;margin:0 0 2px}
.card .p{font-weight:800}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted);border:1px dashed var(--border);border-radius:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.btn.wide{width:100%;padding:14px;font-size:15px;border-radius:14px}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn svg,.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer{flex:none;border-top:1px solid var(--border);padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--fg);font-weight:600;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet{align-items:center}}
.sheet-body{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--border)}
@media(min-width:700px){.sheet-body{border-radius:22px}}
.sheet-body.big{max-width:760px;height:92vh;height:92dvh}
.qr{background:#fff;border-radius:16px;padding:12px;width:208px;margin:0 auto;border:1px solid var(--border)}
.qr svg{display:block;width:100%;height:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:12px}
label.f{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--border);padding:5px;border-radius:14px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnfg)}
.gallery .main{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--fg)}
.price{font-size:26px;font-weight:800;letter-spacing:-.5px}
.pre{white-space:pre-wrap}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.pubbar{position:sticky;top:-18px;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--border);margin-bottom:12px}
.note{font-size:13px;color:var(--muted)}
.plist .item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.plist .item img,.plist .item .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#333;flex:none}
.plist .item .grow{flex:1;min-width:0}
.plist .item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative}
.imgs img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.imgs .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-weight:700;line-height:1;cursor:pointer}
h2{margin:0;font-size:20px;letter-spacing:-.3px}
h3{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btnfg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:100;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo" id="logo"></span><b id="brandName"></b></div>
  <a class="btn" id="supportBtn" target="_blank" rel="noopener"></a>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Storefront catalog</p>
    <h1>Select a digital product</h1>
    <p class="muted" id="count"></p>
  </section>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span id="footText"></span>
</footer>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- icons (inline SVG, no library) ---------- */
  var ICONS = {
    chat: '<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
    download: '<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>',
    send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>'
  };
  function icon(n) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n) { return '\u20B9' + Number(n || 0).toLocaleString('en-IN'); }
  function uid() { return 'p-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function orderId() { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = 'ORD-'; for (var i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
  var toastTimer;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200); }

  /* ---------- state: published data + draft in this browser ---------- */
  var PUB = { stamp: 0, state: {} };
  try { PUB = JSON.parse($('store-data').textContent) || PUB; } catch (e) {}
  var DRAFT_KEY = 'static_site_draft_v2';
  var S = JSON.parse(JSON.stringify(PUB.state || {}));
  var hasDraft = false;
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && d.base === PUB.stamp && d.state) { S = d.state; hasDraft = true; }
      else localStorage.removeItem(DRAFT_KEY);
    }
  } catch (e) {}
  S.products = Array.isArray(S.products) ? S.products : [];
  function saveDraft() {
    hasDraft = true;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: PUB.stamp, state: S })); }
    catch (e) { toast('Browser storage is full. Use image links instead of uploads.'); }
  }

  /* ---------- storefront ---------- */
  function renderStore() {
    document.documentElement.setAttribute('data-theme', S.theme === 'dark' ? 'dark' : 'light');
    var brand = S.brandName || 'My Store';

      fr.onload = function () {

        img.onload = function () {
          var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL(type, 0.82));
        };
        img.onerror = rej; img.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }
  function onProductFiles(e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    Promise.all(files.map(function (f) { return toDataUrl(f, 900, 'image/jpeg'); })).then(function (urls) {
      formImgs = formImgs.concat(urls); drawFormImgs(); toast(urls.length + ' image(s) added');
    }, function () { toast('Could not read that image'); });
  }
  function onLogoFile(e) {
    var f = (e.target.files || [])[0]; if (!f) return;
    toDataUrl(f, 256, 'image/png').then(function (u) { S.brandLogo = u; saveDraft(); renderStore(); toast('Logo updated'); drawAdmin(); }, function () { toast('Could not read that image'); });
  }
  function keepFormValues() { return { t: ($('p-title') || {}).value, p: ($('p-price') || {}).value, d: ($('p-desc') || {}).value }; }
  function restoreFormValues(v) { if (!v) return; $('p-title').value = v.t || ''; $('p-price').value = v.p || ''; $('p-desc').value = v.d || ''; }
  actions.addurl = function () {
    var u = ($('p-url').value || '').trim(); if (!u) return;
    formImgs.push(u); $('p-url').value = ''; drawFormImgs();
  };
  actions.rmimg = function (t) { formImgs.splice(Number(t.getAttribute('data-i')), 1); drawFormImgs(); };
  actions.edit = function (t) {
    editingId = t.getAttribute('data-id'); fillProductForm.done = false;
    drawAdmin(); var f = $('pform'); if (f && f.scrollIntoView) f.scrollIntoView();
  };
  actions['cancel-edit'] = function () { editingId = null; formImgs = []; drawAdmin(); };
  actions.del = function (t) {
    var id = t.getAttribute('data-id');
    if (!window.confirm('Delete this product?')) return;
    S.products = S.products.filter(function (p) { return p.id !== id; });
    if (editingId === id) { editingId = null; formImgs = []; }
    saveDraft(); renderStore(); drawAdmin(); toast('Product deleted');
  };
  submits.product = function () {
    var title = $('p-title').value.trim(), price = Number($('p-price').value);
    if (!title || !(price >= 0)) { toast('Enter title and price'); return; }
    var rec = { id: editingId || uid(), title: title, price: price, description: $('p-desc').value, images: formImgs.slice() };
    var idx = S.products.findIndex(function (p) { return p.id === rec.id; });
    if (idx >= 0) S.products[idx] = rec; else S.products.push(rec);
    editingId = null; formImgs = [];
    saveDraft(); renderStore(); drawAdmin(); toast('Product saved');
  };
  submits.settings = function () {
    S.brandName = $('s-brand').value.trim() || 'My Store';
    var lu = $('s-logo').value.trim(); if (lu) S.brandLogo = lu;
    S.theme = $('s-theme').value === 'dark' ? 'dark' : 'light';
    S.merchantUpiId = $('s-upi').value.trim();
    S.merchantName = $('s-mname').value.trim();
    S.whatsappNumber = $('s-wa').value.replace(/[^\d]/g, '');
    S.adminPin = $('s-pin').value.trim() || '2689';
    saveDraft(); renderStore(); drawAdmin(); toast('Settings saved');
  };
  actions.discard = function () {
    if (!window.confirm('Discard all unpublished changes in this browser?')) return;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    location.reload();
  };

  /* ---------- publish: build updated HTML ---------- */
  function buildHtml() {
    return fetch(location.href.split('#')[0], { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('could not read page, HTTP ' + r.status);
      return r.text();
    }).then(function (html) {
      var re = new RegExp('(<scr' + 'ipt id="store-data"[^>]*>)[\\s\\S]*?(<\\/scr' + 'ipt>)');
      if (!re.test(html)) throw new Error('data block not found');
      var json = JSON.stringify({ stamp: Date.now(), state: S }).replace(/</g, '\\u003c');
      return html.replace(re, function (m, a, b) { return a + json + b; });
    });
  }
  actions.dl = function () {
    buildHtml().then(function (html) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
      toast('Downloaded index.html. Upload it to GitHub to publish.');
    }, function (e) { toast('Open your live https site to export (' + (e.message || e) + ')'); });
  };
  actions.cp = function () {
    buildHtml().then(function (html) { return navigator.clipboard.writeText(html); }).then(
      function () { toast('HTML copied. Paste it into index.html on GitHub.'); },
      function (e) { toast('Could not copy. Try Download HTML.'); });
  };

  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
  renderStore();
  function checkHash() { if (location.hash === '#admin') { openPin(); } }
  window.addEventListener('hashchange', checkHash); checkHash();
})();
</script>
</body>
</html>
